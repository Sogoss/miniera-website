<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/tokens/colors.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/tokens/effects.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/tokens/fonts.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/tokens/spacing.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/tokens/typography.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/_ds_bundle.css">
<link rel="stylesheet" href="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/styles.css">
<script src="_ds/la-miniera-culturale-design-system-d39078a6-f3fd-433a-b5b1-385efa104058/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--surface-page); -webkit-text-size-adjust: 100%; }
  a { color: var(--text-accent); text-decoration: none; }
  a:hover { color: var(--crema-100); }
  [data-scroller]::-webkit-scrollbar, [data-scena]::-webkit-scrollbar, [data-rail]::-webkit-scrollbar { width: 0; height: 0; }
</style>
</helmet>

<div data-ciclo="{{ cicloAttivo }}" style="position: relative; height: 100dvh; overflow: hidden; background: var(--surface-page); color: var(--text-primary); font: var(--type-body);">

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <clipPath id="m-ottofoglio" clipPathUnits="objectBoundingBox">
        <circle cx="0.5" cy="0.5" r="0.275"></circle>
        <circle cx="0.5" cy="0.155" r="0.155"></circle>
        <circle cx="0.5" cy="0.845" r="0.155"></circle>
        <circle cx="0.155" cy="0.5" r="0.155"></circle>
        <circle cx="0.845" cy="0.5" r="0.155"></circle>
        <circle cx="0.256" cy="0.256" r="0.155"></circle>
        <circle cx="0.744" cy="0.256" r="0.155"></circle>
        <circle cx="0.256" cy="0.744" r="0.155"></circle>
        <circle cx="0.744" cy="0.744" r="0.155"></circle>
      </clipPath>
    </defs>
  </svg>

  <div onClick="{{ chiudiNav }}" style="position: absolute; z-index: 58; inset: 0; display: {{ navSchermo }};"></div>

  <div style="position: absolute; z-index: 60; top: 12px; left: 12px; right: 12px;">
    <nav style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: color-mix(in srgb, var(--blu-900) 82%, transparent); backdrop-filter: blur(16px); border: 1px solid var(--border-hairline); border-radius: var(--radius-pill); box-shadow: var(--shadow-lift-lg);">
      <span style="display: flex; flex: none; align-items: center;"><x-import component-from-global-scope="MinieraDS.Marchio" forma="esteso" colore="crema" altezza="{{ 12 }}" hint-size="112px,24px"></x-import></span>
      <span style="flex: 1;"></span>
      <button type="button" onClick="{{ toggleNav }}" aria-expanded="{{ navAperta }}" style="flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; background: var(--accento); border: 0; border-radius: var(--radius-pill); color: var(--nero); font: var(--type-label); font-size: 11px; text-transform: uppercase; letter-spacing: var(--tracking-caps); cursor: pointer;">
        {{ nomeAttiva }}
        <span style="width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transform: rotate({{ freccia }}); transition: transform 220ms ease;"></span>
      </button>
    </nav>

    <div style="position: absolute; top: calc(100% + 8px); right: 0; width: min(260px, 100%); display: flex; flex-direction: column; padding: 6px; background: color-mix(in srgb, var(--blu-900) 92%, transparent); backdrop-filter: blur(18px); border: 1px solid var(--border-hairline); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lift-lg); transform-origin: top right; opacity: {{ navOpacita }}; transform: translateY({{ navMenuY }}) scale({{ navMenuScala }}); pointer-events: {{ navEventi }}; transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1);">
      <sc-for list="{{ voci }}" as="v" hint-placeholder-count="4">
        <button type="button" onClick="{{ v.tocca }}" title="{{ v.titolo }}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 12px; background: {{ v.sfondo }}; border: 0; border-radius: 14px; color: {{ v.colore }}; font: var(--type-label); font-size: 12px; text-transform: uppercase; letter-spacing: var(--tracking-caps); text-align: left; cursor: {{ v.cursore }};">
          {{ v.nome }}
          <span style="display: {{ v.segno }}; width: 7px; height: 7px; border-radius: 999px; background: var(--accento);"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div data-scroller="1" ref="{{ attaccaScroller }}" style="height: 100dvh; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none;">
    <sc-for list="{{ eventi }}" as="ev" hint-placeholder-count="2">
      <section data-scena="1" data-screen-label="{{ ev.dataBreve }}" style="height: 100dvh; box-sizing: border-box; scroll-snap-align: start; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 22px; padding: 82px 22px 96px;">

        <div style="position: relative; flex: none; height: 32vh; min-height: 208px;">
          <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(45deg) scale(0.96); height: 66%; aspect-ratio: 4 / 5; border-radius: var(--radius-pill); overflow: hidden;">
            <div style="width: 100%; height: 100%; transform: rotate(-45deg) scale(1.5);">
              <image-slot id="{{ ev.slot }}" shape="rect" src="{{ ev.foto }}" placeholder="{{ ev.slotTesto }}" style="width: 100%; height: 100%;"></image-slot>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
          <span style="font: var(--type-mono); font-size: 11px; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--accento);">Ciclo {{ ev.nomeCiclo }} · {{ ev.formato }}</span>
          <h1 style="margin: 0; font: var(--type-display); font-size: 38px; line-height: 1.02; letter-spacing: var(--tracking-display); text-wrap: pretty; color: var(--text-primary);">{{ ev.titolo }}</h1>
          <span style="font: var(--type-mono); font-size: 12px; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: {{ ev.statoColore }};">{{ ev.stato }}</span>
        </div>

        <p style="margin: 0; font: var(--type-body); font-size: 17px; line-height: 1.6; color: var(--text-secondary); text-wrap: pretty;">{{ ev.descrizione }}</p>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <sc-for list="{{ ev.ritratti }}" as="rit" hint-placeholder-count="1">
            <div style="display: flex; align-items: center; gap: 14px;">
              <div style="position: relative; width: 56px; height: 56px; flex: none; clip-path: url(#m-ottofoglio); overflow: hidden;">
                <image-slot id="{{ rit.slot }}" shape="rect" src="{{ rit.foto }}" placeholder="Foto" style="width: 100%; height: 100%;"></image-slot>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="font: var(--type-body); font-size: 17px; font-weight: var(--weight-semibold); color: var(--text-primary);">{{ rit.nome }}</span>
                <span style="font: var(--type-small); font-size: 13px; color: var(--text-muted);">{{ rit.ruolo }}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 1px solid var(--border-hairline);">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--accento); flex: none;"><rect x="3" y="5" width="18" height="16"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
            <span style="font: var(--type-body); font-size: 16px; font-weight: var(--weight-semibold); color: var(--text-primary);">{{ ev.data }}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--accento); flex: none;"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
            <span style="font: var(--type-body); font-size: 16px; color: var(--text-primary);">{{ ev.luogo }}</span>
          </div>
          <sc-if value="{{ ev.passato }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 12px;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--accento); flex: none;"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M16 5.4a3.2 3.2 0 0 1 0 6M17.5 14.9c2.1.7 3.5 2.4 3.5 5.1"></path></svg>
              <span style="font: var(--type-body); font-size: 16px; color: var(--text-primary);">{{ ev.presenze }} in sala</span>
            </div>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding-bottom: 8px;">
          <sc-if value="{{ ev.futuro }}" hint-placeholder-val="{{ true }}">
            <a href="https://wa.me/393000000000" target="_blank" rel="noopener" style="display: inline-flex;">
              <x-import component-from-global-scope="MinieraDS.Bottone" variante="primario" misura="lg" hint-size="180px,52px">
                <span style="display: inline-flex; align-items: center; gap: var(--sp-2);">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16"></rect><path d="M3 10h18M8 3v4M16 3v4M9 15l2.2 2.2L16 12.6"></path></svg>
                  Prenota il posto
                </span>
              </x-import>
            </a>
          </sc-if>
          <sc-for list="{{ ev.interventi }}" as="int" hint-placeholder-count="0">
            <a href="{{ int.url }}" target="_blank" rel="noopener" style="display: inline-flex;">
              <x-import component-from-global-scope="MinieraDS.Bottone" variante="primario" misura="lg" hint-size="220px,52px">
                <span style="display: inline-flex; align-items: center; gap: var(--sp-2);">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14"></rect><path d="M10 9.2l5 2.8-5 2.8z"></path></svg>
                  {{ int.etichetta }}
                </span>
              </x-import>
            </a>
          </sc-for>
          <span style="font: var(--type-small); font-size: 13px; color: var(--text-muted);">{{ ev.nota }}</span>
        </div>
      </section>
    </sc-for>
  </div>

  <div data-rail="1" ref="{{ attaccaRail }}" style="position: absolute; z-index: 55; left: 12px; right: 12px; bottom: 12px; overflow: hidden; background: color-mix(in srgb, var(--blu-900) 82%, transparent); backdrop-filter: blur(16px); border: 1px solid var(--border-hairline); border-radius: var(--radius-pill);">
    <div ref="{{ attaccaStriscia }}" style="display: flex; align-items: center; gap: 6px; padding: 6px 0; width: max-content; transform: translateX({{ railX }}); transition: {{ railTransizione }};">
      <sc-for list="{{ tacche }}" as="t" hint-placeholder-count="6">
        <button type="button" ref="{{ t.ref }}" onClick="{{ t.vai }}" title="{{ t.titolo }}" style="flex: none; min-height: 36px; padding: 0 12px; background: {{ t.sfondo }}; border: 0; border-radius: var(--radius-pill); color: {{ t.colore }}; font: var(--type-mono); font-size: 12px; text-transform: uppercase; letter-spacing: var(--tracking-caps); white-space: nowrap; cursor: pointer; transition: background 280ms ease, color 280ms ease;">{{ t.dataBreve }}</button>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.tacchNodi = {};
    this.dati = [
      { ciclo: 1, formato: "incontro", nomeCiclo: "Fondamenta", titolo: "Aprire la miniera", dataBreve: "20 mar", data: "giovedi 20 marzo, ore 21",
        descrizione: "La prima sera. Perche un quartiere senza sale ha bisogno di una sala, e cosa vuol dire tenerla aperta tutte le settimane per un anno intero.",
        ospiti: [{ nome: "Giulia Ferraris", ruolo: "presidente dell'associazione" }], presenze: "210 persone", passato: true },
      { ciclo: 2, formato: "incontro", nomeCiclo: "Sguardi", titolo: "Chi decide dove finisce la citta", dataBreve: "4 giu", data: "giovedi 4 giugno, ore 21",
        descrizione: "Piani regolatori, fermate del tram, confini amministrativi: una serata per capire chi disegna la periferia e con quali strumenti si puo rispondere.",
        ospiti: [{ nome: "Sara Milone", ruolo: "urbanista" }], presenze: "96 persone", passato: true,
        interventi: [{ etichetta: "Rivedi Sara Milone", url: "https://www.youtube.com/@laminieraculturale" }] },
      { ciclo: 2, formato: "proiezione", nomeCiclo: "Sguardi", titolo: "Il cinema che guarda i margini", dataBreve: "18 giu", data: "giovedi 18 giugno, ore 21",
        descrizione: "Tre film, un quartiere, quarant'anni di distanza. Proiezione e discussione su come il racconto per immagini ha trattato le zone di confine.",
        ospiti: [{ nome: "Marco Zatterin", ruolo: "giornalista" }], presenze: "140 persone", passato: true,
        interventi: [{ etichetta: "Rivedi Marco Zatterin", url: "https://www.youtube.com/@laminieraculturale" }] },
      { ciclo: 3, formato: "incontro", nomeCiclo: "Terra di nessuno", titolo: "Chi tiene aperto il quartiere", dataBreve: "24 set", data: "giovedi 24 settembre, ore 21",
        descrizione: "Portinerie sociali, campi da gioco, biblioteche di condominio: chi manda avanti i luoghi che restano aperti quando i servizi chiudono. Si parte dalle esperienze e si finisce con una domanda pratica: cosa serve adesso.",
        ospiti: [{ nome: "Amina Belhaj", ruolo: "educatrice" }, { nome: "Piergiorgio Rosso", ruolo: "presidente del comitato di quartiere" }], passato: false },
      { ciclo: 3, formato: "proiezione", nomeCiclo: "Terra di nessuno", titolo: "Le case che restano", dataBreve: "8 ott", data: "giovedi 8 ottobre, ore 21",
        descrizione: "Un documentario girato per tre anni in un lotto in attesa di demolizione, presentato dalla regista. Al termine si resta a parlare, senza microfono.",
        ospiti: [{ nome: "Chiara Fenoglio", ruolo: "regista" }], passato: false },
      { ciclo: 3, formato: "presentazione", nomeCiclo: "Terra di nessuno", titolo: "Periferia scritta", dataBreve: "22 ott", data: "giovedi 22 ottobre, ore 21",
        descrizione: "Un libro nato da un laboratorio di scrittura fatto qui dentro, letto da chi lo ha scritto. Le copie restano in sala, chi vuole se le porta a casa.",
        ospiti: [{ nome: "Luca Sarti", ruolo: "scrittore" }], passato: false }
    ].map((e, i) => Object.assign({}, e, {
      futuro: !e.passato,
      interventi: e.interventi || [],
      nota: e.passato ? "Puntata registrata in sala" : "Ingresso libero, posti limitati",
      luogo: "Via Fratelli Rosselli 12",
      foto: "https://picsum.photos/seed/miniera-tema-" + i + "/900/1100",
      slot: "mob-locandina-" + i,
      slotTesto: e.passato ? "Foto della serata" : "Locandina",
      ritratti: e.ospiti.map((o, k) => ({ nome: o.nome, ruolo: o.ruolo, foto: "https://picsum.photos/seed/miniera-ospite-" + i + "-" + k + "/600/600", slot: "mob-ritratto-" + i + "-" + k }))
    }));
    this.primoFuturo = this.dati.findIndex((e) => e.futuro);
    this.state = { i: this.primoFuturo, navAperta: false, railX: 0, railAnima: false };
    this.attaccaScroller = this.attaccaScroller.bind(this);
    this.attaccaRail = this.attaccaRail.bind(this);
    this.attaccaStriscia = this.attaccaStriscia.bind(this);
  }

  componentDidMount() {
    this.onResize = () => this.centraRail(false);
    window.addEventListener("resize", this.onResize);
    requestAnimationFrame(() => this.centraRail(false));
    setTimeout(() => this.centraRail(false), 400);
  }

  componentWillUnmount() { window.removeEventListener("resize", this.onResize); }

  componentDidUpdate() {
    if (this.ultimoI !== this.state.i) {
      this.ultimoI = this.state.i;
      this.centraRail();
    }
  }

  attaccaScroller(node) {
    if (this.nodoScroller && this.onScroll) this.nodoScroller.removeEventListener("scroll", this.onScroll);
    this.nodoScroller = node;
    if (!node) return;
    node.scrollTop = this.state.i * node.clientHeight;
    this.onScroll = () => {
      const n = Math.round(node.scrollTop / node.clientHeight);
      if (this.bersaglio != null) {
        if (n === this.bersaglio) this.bersaglio = null;
        return;
      }
      if (n !== this.state.i) this.setState({ i: n });
    };
    node.addEventListener("scroll", this.onScroll, { passive: true });
  }

  attaccaRail(node) { this.nodoRail = node; if (node) requestAnimationFrame(() => this.centraRail(false)); }

  attaccaStriscia(node) { this.nodoStriscia = node; if (node) requestAnimationFrame(() => this.centraRail(false)); }

  centraRail(animato) {
    const rail = this.nodoRail, striscia = this.nodoStriscia, b = this.tacchNodi[this.state.i];
    if (!rail || !striscia || !b) return;
    const dentro = b.offsetLeft - striscia.offsetLeft;
    const x = rail.clientWidth / 2 - (dentro + b.offsetWidth / 2);
    if (Math.abs(x - this.state.railX) > 0.5) this.setState({ railX: x, railAnima: animato !== false });
  }

  vai(n) {
    const el = this.nodoScroller;
    if (!el) return;
    const i = Math.max(0, Math.min(this.dati.length - 1, n));
    this.bersaglio = i;
    clearTimeout(this.timerSalto);
    this.timerSalto = setTimeout(() => { this.bersaglio = null; }, 1200);
    el.scrollTo({ top: i * el.clientHeight, behavior: "smooth" });
    this.setState({ i: i });
  }

  renderVals() {
    const attivo = this.state.i, aperta = this.state.navAperta;
    const pagine = [
      { id: "programma", nome: "Programma", pronta: true },
      { id: "rassegna", nome: "Stampa", pronta: false },
      { id: "chi-siamo", nome: "Chi siamo", pronta: true },
      { id: "contatti", nome: "Contatti", pronta: true }
    ];
    return {
      cicloAttivo: (this.dati[attivo] || this.dati[0]).ciclo,
      attaccaScroller: this.attaccaScroller,
      attaccaRail: this.attaccaRail,
      attaccaStriscia: this.attaccaStriscia,
      railX: this.state.railX + "px",
      railTransizione: this.state.railAnima ? "transform 420ms cubic-bezier(0.2, 0.9, 0.2, 1)" : "none",
      navAperta: aperta,
      navSchermo: aperta ? "block" : "none",
      navOpacita: aperta ? 1 : 0,
      navMenuY: aperta ? "0px" : "-10px",
      navMenuScala: aperta ? 1 : 0.97,
      navEventi: aperta ? "auto" : "none",
      freccia: aperta ? "180deg" : "0deg",
      nomeAttiva: "Programma",
      toggleNav: () => this.setState({ navAperta: !aperta }),
      chiudiNav: () => this.setState({ navAperta: false }),
      voci: pagine.map((p) => ({
        nome: p.nome,
        titolo: p.pronta ? p.nome : "In preparazione",
        segno: p.id === "programma" ? "block" : "none",
        cursore: p.pronta ? "pointer" : "not-allowed",
        sfondo: p.id === "programma" ? "color-mix(in srgb, var(--accento) 20%, transparent)" : "transparent",
        colore: p.id === "programma" ? "var(--accento)" : (p.pronta ? "var(--text-primary)" : "var(--text-muted)"),
        tocca: () => this.setState({ navAperta: false })
      })),
      eventi: this.dati.map((e) => Object.assign({}, e, {
        stato: e.passato ? "gia svolto" : "in programma",
        statoColore: e.passato ? "var(--text-muted)" : "var(--accento)"
      })),
      tacche: this.dati.map((e, i) => ({
        dataBreve: e.dataBreve,
        titolo: e.titolo,
        sfondo: i === attivo ? "var(--accento)" : "transparent",
        colore: i === attivo ? "var(--nero)" : "var(--text-secondary)",
        ref: (n) => { this.tacchNodi[i] = n; },
        vai: () => this.vai(i)
      }))
    };
  }
}

</script>
</body>
</html>
